name: Registry refresh

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4

      - name: Run registry-check --fix
        id: check
        run: |
          go run ./cmd/registry-check --fix > report.md
          if [ -s report.md ]; then
            echo "empty=false" >> "$GITHUB_OUTPUT"
          else
            echo "empty=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update pull request
        if: steps.check.outputs.empty == 'false'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(registry): refresh skills.json"
          title: "Registry refresh"
          body-path: report.md
          branch: registry-refresh
          add-paths: registry/skills.json
