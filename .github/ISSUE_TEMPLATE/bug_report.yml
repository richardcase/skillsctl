name: Bug report
description: Report something that isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command run
      description: The exact skillsctl command(s), including flags.
      render: shell
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Output, error messages, or logs. Use --dry-run output where relevant.
      render: shell

  - type: input
    id: version
    attributes:
      label: skillsctl version
      description: Output of `skillsctl --version`.
      placeholder: skillsctl 0.1.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: macOS 15 arm64 / Linux x86_64
    validations:
      required: true
